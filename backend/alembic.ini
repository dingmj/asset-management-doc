# ============================================================
# Alembic configuration
#
# NOTE (important):
#   configparser reads THIS file with the OS locale codec (cp936/GBK on
#   Chinese Windows), so the file must stay pure ASCII -- non-ASCII
#   comments here raise UnicodeDecodeError. All Chinese documentation
#   lives in alembic/env.py instead.
#
# The database URL is NOT stored here: alembic/env.py injects it from
# .env via app.core.config.settings, so credentials never reach VCS.
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = .
# Migration file name pattern: <revision>_<slug>.py
file_template = %%(rev)s_%%(slug)s
# Timezone used for the revision timestamp
timezone = Asia/Shanghai
# Left empty on purpose; env.py always overrides it from settings
sqlalchemy.url =

[post_write_hooks]
# Auto-format generated migrations (requires ruff/black)
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

# ==================== logging ====================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
